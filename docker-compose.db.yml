services:
  # 1. THE DATABASE
  postgres:
    image: postgres:16-alpine
    container_name: lomashwood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. THE NEXT.JS APP (Add this section!)
  app:
    build: .
    container_name: nextjs-app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy # This waits for PG to be ready before starting app
    environment:
      # CRITICAL: Use 'postgres' (the service name) instead of 'localhost'
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?schema=public
      - RUN_DB_SEED=true

volumes:
  postgres_data:
